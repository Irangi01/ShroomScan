<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ShroomScan</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>
    <!-- ================== Header & Navigation ================== -->
    <header>
        <div class="header-container">
            <a href="../index.html" class="logo">
                <img src="../assets/images/logo.png" alt="ShroomScan Logo" class="logo-img">
                <span>ShroomScan</span>
            </a>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="domain.html">Domain</a></li>
                    <li><a href="milestones.html">Milestones</a></li>
                    <li><a href="documents.html">Documents</a></li>
                    <li><a href="slides.html">Slides</a></li>
                    <li><a href="about.html">About us</a></li>
                    <li><a href="contact.html">Contact us</a></li>
                </ul>
            </nav>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>


    <!-- ================== Main Content ================== -->
    <main>
        <section class="section">
            <h2 class="page-title">We'd Love to Hear From You</h2>

            <div class="contact-container">


                <!-- Contact Form -->
                <div
                    style="background: white; padding: 20px; width: 500px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
                    <h3 style="color: #8a6a48; font-size: 20px; margin-bottom: 12px;">Send us a Message</h3>
                    <form style="display: flex; flex-direction: column;">
                        <div class="form-group">
                            <label>Name *</label>
                            <input type="text" placeholder="Your Full Name" required>
                        </div>

                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" placeholder="your.email@example.com" required>
                        </div>

                        <div class="form-group">
                            <label>Subject *</label>
                            <input type="text" placeholder="Message Subject" required>
                        </div>

                        <div class="form-group">
                            <label>Message *</label>
                            <textarea placeholder="Your message here..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Category (Optional)</label>
                            <select
                                style="width: 100%; padding: 12px; border: 1px solid #c8b296; border-radius: 4px; font-family: inherit; font-size: 14px;">
                                <option value="">Select a category</option>
                                <option value="inquiry">General Inquiry</option>
                                <option value="collaboration">Collaboration Request</option>
                                <option value="feedback">Feedback</option>
                                <option value="technical">Technical Support</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <button type="submit" class="btn" style="margin-top: 10px;">Send Message</button>
                    </form>
                </div>
            </div>
        </section>


    </main>

    <!-- ================== Footer ================== -->
    <footer>
        <p>&copy; 2025 Smart Mushroom Incubation System Research Project. All rights reserved.</p>
        <p>Faculty of Computing | SLIIT</p>
    </footer>

    <script>
        // Initialize mobile nav state
        function initMobileNav() {
            const nav = document.querySelector('nav');
            const hamburger = document.querySelector('.hamburger');
            
            if (window.innerWidth <= 768) {
                nav.classList.add('mobile-hidden');
            } else {
                nav.classList.remove('mobile-hidden');
            }
        }

        function toggleMenu() {
            const hamburger = document.querySelector('.hamburger');
            const nav = document.querySelector('nav');
            hamburger.classList.toggle('active');
            nav.classList.toggle('active');
            nav.classList.toggle('mobile-hidden');
        }

        // Close menu when a link is clicked
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.hamburger').classList.remove('active');
                document.querySelector('nav').classList.remove('active');
                document.querySelector('nav').classList.add('mobile-hidden');
            });
        });

        // Initialize on page load and on resize
        window.addEventListener('load', initMobileNav);
        window.addEventListener('resize', initMobileNav);
    </script>
</body>

</html>
